[project]
name = "alpha-mining"
version = "1.0.0"
description = "LLM-driven formulaic alpha mining on WorldQuant BRAIN (archived research project)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Zequn Li" }]
keywords = ["quantitative-finance", "alpha-mining", "llm-agents", "factor-investing"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "litellm>=1.60",
    "pymupdf4llm>=0.0.17",
    "rich>=13.9",
    "aiosqlite>=0.21",
    "python-dotenv>=1.1",
    "yfinance>=0.2",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "markdown>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]
# Only needed by scripts/factor_pnl_analysis.py (spectral coherence analysis).
analysis = [
    "scipy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alpha_mining"]

[tool.ruff]
target-version = "py311"
line-length = 120
# server/ is a git submodule with its own tooling; local/ is gitignored scratch space.
exclude = ["server", "local", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
