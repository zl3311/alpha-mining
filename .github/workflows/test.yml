name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      # The suite is offline: no BRAIN account, queue server, or API keys required.
      - name: Run tests
        run: uv run python3 -m pytest tests/ -q

      - name: Lint
        run: uv run ruff check .
